</div><div class="article-content field field--name-body field--type-text-with-summary field--label-hidden field--item"><p align="left"><span><strong><span><span>一、大赛简介</span></span></strong></span></p>
<p><span><span><span>全国大学生数字媒体科技作品及创意竞赛（以下简称“数媒竞赛”）是面向全国高校在校学生举办的数字媒体科技与创意实践类赛事，已于2023年纳入《全国普通高校大学生竞赛分析报告》竞赛目录。数媒竞赛坚持“科技创领未来·创意变革时代”的办赛宗旨，依托作品创作、分级选拔、成果展示、答辩评价等环节，助力数字媒体、人工智能、虚拟现实、数字创意等相关领域的人才培养，推动相关领域实践创新发展。</span></span></span></p>
